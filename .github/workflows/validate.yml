name: Validate repository

on:
  push:
    branches: [main, "automation/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pandas numpy rasterio pytest

      - name: Repository validation
        run: python validation/validate_repository.py

      - name: Reconstruction automation tests
        run: pytest -q tests/test_reconstruction_pipeline.py
