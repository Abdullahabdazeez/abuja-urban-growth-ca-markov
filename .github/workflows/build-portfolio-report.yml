name: Build Abuja portfolio PDF report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown weasyprint
      - run: python scripts/python/build_portfolio_report.py
      - name: Commit PDF report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/Abuja_Urban_Growth_Portfolio_Report.pdf
          git diff --cached --quiet || git commit -m "Build Abuja portfolio PDF report"
          git push
