name: Reconstruction CI

on:
  push:
    branches: [main, full-reconstruction-automation]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install pandas numpy pytest
      - run: pytest -q

  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('README.md'),
              Path('reconstruction_pipeline/reference_gate.py'),
              Path('tests/test_reference_gate.py'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing required reconstruction files: ' + ', '.join(missing))
          print('PASS_REPOSITORY_INTEGRITY')
          PY
